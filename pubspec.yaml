name: smart_quiz
description: Aplikasi Bimbingan Belajar Interaktif SD - KKN 85 Desa Tanjung Harapan

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/iconquiz.png"
  min_sdk_android: 21
  adaptive_icon_background: "#C8B8FF"
  adaptive_icon_foreground: "assets/icons/iconquiz.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/audio/quiz_correct.mp3
    - assets/audio/quiz_wrong.mp3
    - assets/audio/quiz_complete.mp3
    - assets/audio/backsound.mp3
